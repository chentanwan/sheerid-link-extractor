name: Feature request
description: Suggest a new feature or improvement for the SheerID Link Extractor
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea clearly.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use case
      description: What problem does this solve, or what workflow does it improve?
      placeholder: I want to be able to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this feature to behave? (UI, behavior, options, etc.)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
